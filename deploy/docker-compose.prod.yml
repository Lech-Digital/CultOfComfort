# Cult of Comfort game server — production stack.
#
# Runs beside Coldstart, PurePrep, CoreChoice and Coo on the shared Hetzner host, behind Coldstart's Caddy (the
# `coldstart_default` network), which does TLS and routing:
#   api.cultofcomfort.lechdigital.nl { reverse_proxy cultofcomfort-api:8080 }
#
# The service and container are called "cultofcomfort-api" on purpose: Compose publishes the service name as a DNS
# alias on the shared network, and a generic name ("web", "api") once hijacked another app's traffic there.
#
# Deploy (from /opt/cultofcomfort on the server):
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# Its own project name: PurePrep's stack also lives in a folder called "deploy", and without this both would be the
# Compose project "deploy" — each other's "orphans", one `--remove-orphans` away from taking the other app down.
name: cultofcomfort

services:
  cultofcomfort-api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: cultofcomfort-api
    container_name: cultofcomfort-api
    restart: unless-stopped
    # Secrets that never go through git or the deploy rsync (Village__DevKey: the owner's testing gate, ADR 0007).
    env_file:
      - path: ../secrets.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Development commands (finish now, raise Tension, record a Night) stay refused in production.
      Village__AllowDevelopmentCommands: "false"
      # Sign in with Google (ADR 0007): the Web client id from Google Cloud project cult-of-comfort. Public, not a secret.
      Auth__GoogleClientIds__0: "306329299380-ldti7e8ln5afc69r6mm3g64ldjgfipfu.apps.googleusercontent.com"
    volumes:
      - cultofcomfort-data:/data
    networks:
      - coldstart_default
    expose:
      - "8080"

networks:
  coldstart_default:
    external: true

volumes:
  cultofcomfort-data:
